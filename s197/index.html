(function () {
  var q = new URLSearchParams(location.search), f = Number(q.get("f")) || 0, area = q.get("area");
  var CONDICAO = "https://pay.hub.la/BGYisRtukyHcBcxu2KKh", CHEIO = "https://pay.hub.la/kF2OkFJoac58amiuXLh3", AREA = "https://app.hub.la/m/O0YTLKsLctLSnrqFcG3I";
  q.delete("f"); q.delete("area");
  var extra = q.toString() ? "?" + q.toString() : "";
  location.replace(area ? AREA : (Date.now() <= f * 1000 ? CONDICAO + extra : CHEIO + extra));
})();
